<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campañas fiordo Puyuhuapi</title>
  <meta name="description" content="Línea de tiempo de las campañas CTD del fiordo Puyuhuapi, proyecto Fondecyt 1262020">

  <!-- Tipografía Fraunces (Google Fonts) para el título -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">

  <style>
    /* ====== COLORES ====== */
    :root {
      --fondo: #f6f4ef;
      --texto: #22262b;
      --texto-suave: #5c636b;
      --cielo-arriba: #f6f4ef;    /* cielo: claro arriba... */
      --cielo-horizonte: #e6eef1; /* ...levemente azulado cerca del horizonte */
      --mar-superficie: #b3d4de;  /* agua clara justo bajo la superficie */
      --mar-fondo: #6f9fb2;       /* agua más oscura abajo (sin llegar a negro) */
      --brillo: #ffffff;          /* línea de la superficie */
      --texto-agua: #0e3b52;      /* texto sobre el agua */
      --borde-punto: #0e3b52;
      --resalte: #e0a526;
      --blanco: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;         /* evita barra horizontal por la línea de ancho completo */
      display: flex;
      flex-direction: column;
      justify-content: center;    /* la línea de tiempo queda justo al medio de la pantalla, donde está el horizonte */
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    /* ====== PAISAJE DE FIORDO (fondo fijo detrás de todo) ====== */
    .paisaje {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      animation: aparecer 1.2s ease-out both;
    }
    .cielo {
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 50%;
      background: linear-gradient(to bottom, var(--cielo-arriba) 30%, var(--cielo-horizonte) 100%);
    }
    .agua {
      position: absolute;
      left: 0; right: 0; top: 50%; bottom: 0;
      background: linear-gradient(to bottom, var(--mar-superficie) 0%, var(--mar-fondo) 100%);
    }
    /* Cerros: apoyados justo sobre el horizonte */
    .cerros, .reflejo, .oleaje {
      position: absolute;
      left: 0;
      width: 100%;
    }
    .cerros { bottom: 50%; height: 20vh; }
    /* Reflejo: los mismos cerros dados vuelta, muy tenues, bajo el horizonte */
    .reflejo { top: 50%; height: 20vh; transform: scaleY(-1); opacity: 0.22; }
    .oleaje { top: 50%; height: 40vh; }

    .contenedor {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* El título va encima de la línea sin empujarla: así la línea coincide con la superficie */
    .encabezado {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(100% + 8px);
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .subtitulo {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--texto-suave);
    }

    /* ====== LÍNEA DE TIEMPO (horizontal en computador) ======
       Cada elemento tiene --pos entre 0 y 1: su lugar en el tiempo
       (0 = septiembre 2023, 1 = noviembre 2025, proporcional a los meses). */
    .linea-tiempo {
      --margen: 7%;               /* espacio a los lados para que no se corten las etiquetas */
      position: relative;
      height: 300px;
    }

    /* La superficie del mar */
    .eje {
      position: absolute;
      left: calc(50% - 50vw);     /* cruza toda la pantalla, como un horizonte */
      width: 100vw;
      top: 50%;
      height: 3px;
      margin-top: -1.5px;
      background: var(--brillo);
      border-radius: 2px;
      transform-origin: left center;
      animation: dibujar-x 0.9s ease-out both;
    }

    /* Inicio de cada año: línea punteada vertical */
    .division {
      position: absolute;
      top: 12%;
      bottom: 12%;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      border-left: 1px dashed rgba(14, 59, 82, 0.25);
      animation: aparecer 0.6s ease-out 0.9s both;
    }

    /* Año escrito abajo (dentro del agua), al centro de su tramo */
    .anio {
      position: absolute;
      bottom: 0;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      transform: translateX(-50%);
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: rgba(14, 59, 82, 0.65);
      animation: aparecer 0.6s ease-out 0.9s both;
    }

    /* Cada campaña: el círculo es el enlace (la etiqueta también es cliqueable).
       --i es el orden: los círculos aparecen uno tras otro. */
    .campana {
      position: absolute;
      top: 50%;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      color: var(--texto);
      text-decoration: none;
      animation: aparecer-punto 0.45s ease-out both;
      animation-delay: calc(0.6s + var(--i) * 0.12s);
    }

    .punto {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--blanco);
      border: 3px solid var(--borde-punto);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s, background 0.15s;
    }

    .texto {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .texto span { display: block; }
    .texto .mes { font-weight: bold; }
    .texto .anio-c { color: var(--texto-suave); }

    /* Etiquetas alternadas: así no chocan las campañas cercanas en el tiempo */
    .arriba .texto { bottom: 36px; }
    .abajo .texto { top: 36px; }
    /* Las de abajo quedan sobre el agua: azul oscuro */
    .abajo .texto .mes { color: var(--texto-agua); }
    .abajo .texto .anio-c { color: rgba(14, 59, 82, 0.75); }

    /* Al pasar el mouse o con el teclado: el círculo crece y se pone naranjo */
    .campana:hover .punto,
    .campana:focus-visible .punto {
      transform: scale(1.3);
      background: var(--resalte);
    }
    .campana:focus-visible { outline: none; }
    .campana:focus-visible .punto { outline: 3px solid var(--resalte); outline-offset: 3px; }

    /* ====== ANIMACIONES DE ENTRADA ====== */
    @keyframes dibujar-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes dibujar-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    @keyframes aparecer-punto {
      from { opacity: 0; transform: scale(0.3); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Si la persona pidió a su sistema reducir el movimiento, no se anima nada */
    @media (prefers-reduced-motion: reduce) {
      .eje, .division, .anio, .campana, .paisaje { animation: none; }
    }

    /* ====== CELULAR: línea vertical, sin el paisaje (no calza con una línea vertical) ====== */
    @media (max-width: 700px) {
      .paisaje { display: none; }
      body { justify-content: flex-start; }
      .contenedor { padding: 32px 16px; }
      .encabezado { position: static; margin-bottom: 28px; }

      .linea-tiempo { --margen: 4%; height: 760px; }

      .eje {
        left: 40px; right: auto;
        top: 0; bottom: 0;
        width: 3px; height: auto;
        margin: 0 0 0 -1.5px;
        background: var(--borde-punto);
        transform-origin: center top;
        animation-name: dibujar-y;
      }
      .division {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        bottom: auto;
        left: 10px; right: 0;
        border-left: none;
        border-top: 1px dashed rgba(14, 59, 82, 0.3);
      }
      .anio {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        bottom: auto;
        left: auto; right: 0;
        transform: translateY(-50%);
        color: var(--texto-suave);
      }
      .campana {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        left: 40px;
      }
      .texto,
      .arriba .texto,
      .abajo .texto {
        top: 50%; bottom: auto;
        left: 38px;
        transform: translateY(-50%);
        text-align: left;
      }
      .texto span { display: inline; }
      .abajo .texto .mes { color: var(--texto); }
      .abajo .texto .anio-c { color: var(--texto-suave); }
    }
  </style>
</head>

<body>
  <!-- ====== PAISAJE DE FIORDO (solo decoración) ======
       Tres capas de cerros: las más lejanas más claras (efecto de neblina).
       Las laderas suben hacia los costados y bajan al centro: la entrada del fiordo. -->
  <div class="paisaje" aria-hidden="true">
    <div class="cielo"></div>
    <div class="agua"></div>

    <svg class="cerros" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <!-- Lejanos -->
      <path fill="#d3dfe4" d="M0,200 L0,70 C70,55 130,30 210,42 C290,54 330,18 410,26 C490,34 540,72 620,62 C700,52 740,14 820,22 C900,30 950,64 1030,54 C1100,46 1150,26 1200,34 L1200,200 Z"/>
      <!-- Intermedios -->
      <path fill="#b8cbd3" d="M0,200 L0,82 C60,78 110,92 180,108 C250,124 320,104 400,118 C480,132 540,150 620,146 C700,142 760,120 840,124 C920,128 980,104 1060,92 C1120,84 1170,74 1200,70 L1200,200 Z"/>
      <!-- Cercanos: altos en los costados, bajos al centro -->
      <path fill="#9bb4be" d="M0,200 L0,96 C50,100 110,128 190,148 C290,170 420,182 600,184 C780,182 910,170 1010,148 C1090,128 1150,100 1200,94 L1200,200 Z"/>
    </svg>

    <!-- Reflejo de los cerros en el agua -->
    <svg class="reflejo" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path fill="#4f7f92" d="M0,200 L0,82 C60,78 110,92 180,108 C250,124 320,104 400,118 C480,132 540,150 620,146 C700,142 760,120 840,124 C920,128 980,104 1060,92 C1120,84 1170,74 1200,70 L1200,200 Z"/>
      <path fill="#3f6f82" d="M0,200 L0,96 C50,100 110,128 190,148 C290,170 420,182 600,184 C780,182 910,170 1010,148 C1090,128 1150,100 1200,94 L1200,200 Z"/>
    </svg>

    <!-- Líneas finas de oleaje -->
    <svg class="oleaje" viewBox="0 0 1200 300" preserveAspectRatio="none" fill="none" stroke="#ffffff" stroke-linecap="round">
      <path stroke-opacity="0.45" stroke-width="1.5" d="M80,40 q30,-6 60,0 t60,0"/>
      <path stroke-opacity="0.35" stroke-width="1.5" d="M930,60 q30,-6 60,0 t60,0 t60,0"/>
      <path stroke-opacity="0.30" stroke-width="1.5" d="M420,120 q30,-6 60,0 t60,0"/>
      <path stroke-opacity="0.25" stroke-width="1.5" d="M700,190 q30,-6 60,0 t60,0 t60,0"/>
      <path stroke-opacity="0.20" stroke-width="1.5" d="M180,250 q30,-6 60,0 t60,0"/>
    </svg>
  </div>

  <div class="contenedor">
    <header class="encabezado">
      <h1>Campañas fiordo Puyuhuapi</h1>
      <p class="subtitulo">Proyecto Fondecyt 1262020</p>
    </header>

    <!-- Posiciones (--pos) = meses desde septiembre 2023 / 28 meses totales (hasta enero 2026).
         Al agregar una campaña más lejana, recalcular todas: pos = meses desde sep 2023 / meses totales -->
    <nav class="linea-tiempo" aria-label="Línea de tiempo de campañas">
      <div class="eje"></div>

      <!-- Inicio de 2024 (mes 4) y de 2025 (mes 16); el inicio de 2026 (mes 28) coincide con la última campaña -->
      <div class="division" style="--pos: 0.1429"></div>
      <div class="division" style="--pos: 0.5714"></div>

      <!-- Años al centro de su tramo (2026 bajo su única campaña) -->
      <div class="anio" style="--pos: 0.0714">2023</div>
      <div class="anio" style="--pos: 0.3571">2024</div>
      <div class="anio" style="--pos: 0.7857">2025</div>
      <div class="anio" style="--pos: 1">2026</div>

      <a class="campana abajo"  style="--pos: 0;      --i: 0" href="campanas/1_septiembre_2023.html"><span class="punto"></span><span class="texto"><span class="mes">Septiembre</span> <span class="anio-c">2023</span></span></a>
      <a class="campana arriba" style="--pos: 0.0714; --i: 1" href="campanas/2_noviembre_2023.html"><span class="punto"></span><span class="texto"><span class="mes">Noviembre</span> <span class="anio-c">2023</span></span></a>
      <a class="campana abajo"  style="--pos: 0.1786; --i: 2" href="campanas/3_febrero_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Febrero</span> <span class="anio-c">2024</span></span></a>
      <a class="campana arriba" style="--pos: 0.3214; --i: 3" href="campanas/4_junio_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Junio</span> <span class="anio-c">2024</span></span></a>
      <a class="campana abajo"  style="--pos: 0.4643; --i: 4" href="campanas/5_octubre_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Octubre</span> <span class="anio-c">2024</span></span></a>
      <a class="campana arriba" style="--pos: 0.6071; --i: 5" href="campanas/6_febrero_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Febrero</span> <span class="anio-c">2025</span></span></a>
      <a class="campana abajo"  style="--pos: 0.8214; --i: 6" href="campanas/7_agosto_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Agosto</span> <span class="anio-c">2025</span></span></a>
      <a class="campana arriba" style="--pos: 0.9286; --i: 7" href="campanas/8_noviembre_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Noviembre</span> <span class="anio-c">2025</span></span></a>
      <!-- Campaña 9: la carpeta original dice "Febrero 2026", pero los lances fueron del 28 al 30 de enero -->
      <a class="campana abajo"  style="--pos: 1;      --i: 8" href="campanas/9_enero_2026.html"><span class="punto"></span><span class="texto"><span class="mes">Enero</span> <span class="anio-c">2026</span></span></a>
    </nav>
  </div>
</body>
