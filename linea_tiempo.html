<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campañas fiordo Puyuhuapi</title>
  <meta name="description" content="Línea de tiempo de las campañas CTD del fiordo Puyuhuapi, proyecto Fondecyt 1262020">

  <style>
    /* ====== COLORES (los mismos del visor CTD) ====== */
    :root {
      --fondo: #f6f4ef;
      --texto: #22262b;
      --texto-suave: #5c636b;
      --acento: #1f5f5b;
      --linea: #dcd8cd;
      --blanco: #ffffff;
      --resalte: #e0a526;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;       /* la línea de tiempo queda al centro de la pantalla */
      font-family: Georgia, "Times New Roman", serif;
      color: var(--texto);
      background: var(--fondo);
    }

    .contenedor {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    h1 { margin: 0 0 4px; text-align: center; line-height: 1.2; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .subtitulo { margin: 0 0 40px; text-align: center; color: var(--texto-suave); }

    /* ====== LÍNEA DE TIEMPO (horizontal en computador) ======
       Cada elemento tiene --pos entre 0 y 1: su lugar en el tiempo
       (0 = septiembre 2023, 1 = noviembre 2025, proporcional a los meses). */
    .linea-tiempo {
      --margen: 7%;                  /* espacio a los lados para que no se corten las etiquetas */
      position: relative;
      height: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .eje {
      position: absolute;
      left: var(--margen);
      right: var(--margen);
      top: 50%;
      height: 3px;
      margin-top: -1.5px;
      background: var(--acento);
      border-radius: 2px;
    }

    /* Inicio de cada año: línea punteada vertical */
    .division {
      position: absolute;
      top: 15%;
      bottom: 15%;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      border-left: 1px dashed var(--linea);
    }

    /* Año escrito abajo, al centro de su tramo */
    .anio {
      position: absolute;
      bottom: 0;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      transform: translateX(-50%);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--texto-suave);
    }

    /* Cada campaña: el círculo es el enlace (la etiqueta también es cliqueable) */
    .campana {
      position: absolute;
      top: 50%;
      left: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      color: var(--texto);
      text-decoration: none;
    }

    .punto {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--acento);
      border: 3px solid var(--blanco);
      box-shadow: 0 0 0 1px var(--acento), 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s, background 0.15s;
    }

    .texto {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .texto span { display: block; }
    .texto .mes { font-weight: bold; }
    .texto .anio-c { color: var(--texto-suave); }

    /* Etiquetas alternadas: así no chocan las campañas cercanas en el tiempo */
    .abajo .texto { top: 36px; }
    .arriba .texto { bottom: 36px; }

    /* Al pasar el mouse o con el teclado: el círculo crece y cambia de color */
    .campana:hover .punto,
    .campana:focus-visible .punto {
      transform: scale(1.3);
      background: var(--resalte);
      box-shadow: 0 0 0 1px var(--resalte), 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .campana:hover .mes,
    .campana:focus-visible .mes { color: var(--acento); }
    .campana:focus-visible { outline: none; }
    .campana:focus-visible .punto { outline: 3px solid var(--resalte); outline-offset: 3px; }

    footer {
      margin-top: 40px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      color: var(--texto-suave);
    }
    footer a { color: var(--acento); }

    /* ====== CELULAR: la línea se vuelve vertical ====== */
    @media (max-width: 700px) {
      body { justify-content: flex-start; }
      .linea-tiempo { --margen: 4%; height: 760px; }

      .eje {
        left: 40px; right: auto;
        top: var(--margen); bottom: var(--margen);
        width: 3px; height: auto;
        margin: 0 0 0 -1.5px;
      }
      .division {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        bottom: auto;
        left: 10px; right: 0;
        border-left: none;
        border-top: 1px dashed var(--linea);
      }
      .anio {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        bottom: auto;
        left: auto; right: 0;
        transform: translateY(-50%);
      }
      .campana {
        top: calc(var(--margen) + var(--pos) * (100% - 2 * var(--margen)));
        left: 40px;
      }
      .texto,
      .abajo .texto,
      .arriba .texto {
        top: 50%; bottom: auto;
        left: 38px;
        transform: translateY(-50%);
        text-align: left;
      }
      .texto span { display: inline; }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>Campañas fiordo Puyuhuapi</h1>
    <p class="subtitulo">Proyecto Fondecyt 1262020</p>

    <!-- Posiciones (--pos) = meses desde septiembre 2023 / 26 meses totales -->
    <nav class="linea-tiempo" aria-label="Línea de tiempo de campañas">
      <div class="eje"></div>

      <!-- Inicio de 2024 (mes 4) y de 2025 (mes 16) -->
      <div class="division" style="--pos: 0.1538"></div>
      <div class="division" style="--pos: 0.6154"></div>

      <!-- Años al centro de su tramo -->
      <div class="anio" style="--pos: 0.0769">2023</div>
      <div class="anio" style="--pos: 0.3846">2024</div>
      <div class="anio" style="--pos: 0.8077">2025</div>

      <a class="campana abajo"  style="--pos: 0"      href="campanas/1_septiembre_2023.html"><span class="punto"></span><span class="texto"><span class="mes">Septiembre</span> <span class="anio-c">2023</span></span></a>
      <a class="campana arriba" style="--pos: 0.0769" href="campanas/2_noviembre_2023.html"><span class="punto"></span><span class="texto"><span class="mes">Noviembre</span> <span class="anio-c">2023</span></span></a>
      <a class="campana abajo"  style="--pos: 0.1923" href="campanas/3_febrero_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Febrero</span> <span class="anio-c">2024</span></span></a>
      <a class="campana arriba" style="--pos: 0.3462" href="campanas/4_junio_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Junio</span> <span class="anio-c">2024</span></span></a>
      <a class="campana abajo"  style="--pos: 0.5"    href="campanas/5_octubre_2024.html"><span class="punto"></span><span class="texto"><span class="mes">Octubre</span> <span class="anio-c">2024</span></span></a>
      <a class="campana arriba" style="--pos: 0.6538" href="campanas/6_febrero_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Febrero</span> <span class="anio-c">2025</span></span></a>
      <a class="campana abajo"  style="--pos: 0.8846" href="campanas/7_agosto_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Agosto</span> <span class="anio-c">2025</span></span></a>
      <a class="campana arriba" style="--pos: 1"      href="campanas/8_noviembre_2025.html"><span class="punto"></span><span class="texto"><span class="mes">Noviembre</span> <span class="anio-c">2025</span></span></a>
    </nav>
  </div>
</body>
</html>
