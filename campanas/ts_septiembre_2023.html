<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagrama TS Septiembre 2023</title>
  <meta name="description" content="Diagrama temperatura-salinidad de la campaña Septiembre 2023 en el fiordo Puyuhuapi, proyecto Fondecyt 1262020">

  <!-- Tipografía Fraunces (la misma de la línea de tiempo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
  <!-- SheetJS: lee los Excel directamente en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Plotly "gl2d": dibuja con la tarjeta gráfica, necesario para ~43 000 puntos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly-gl2d.min.js"></script>
  <!-- Estilo compartido por las páginas de campaña -->
  <link rel="stylesheet" href="visor_campana.css">

  <style>
    /* El diagrama TS se ve mejor casi cuadrado: se limita el ancho de la página */
    .contenedor { max-width: 1040px; }
    .zona-ts {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 16px;
    }
    #grafico { height: 680px; }
    .nota {
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--texto-suave);
      line-height: 1.5;
    }
    @media (max-width: 700px) {
      .zona-ts { grid-template-columns: 1fr; }
      #grafico { height: 520px; }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <a class="volver" href="1_septiembre_2023.html">&larr; Campaña Septiembre 2023</a>
    <h1>Diagrama T-S · Septiembre 2023</h1>
    <p class="subtitulo">Campaña 1 · 17 estaciones · Proyecto Fondecyt 1262020</p>

    <div class="caja">
      <div class="zona-ts">
        <!-- Gráfico (izquierda) -->
        <div id="grafico"><div class="vacio" id="cargando">Cargando datos…</div></div>

        <!-- Controles (derecha) -->
        <div class="lateral">
          <div class="campo">
            <label for="selEstacion">Estación</label>
            <select id="selEstacion"></select>
          </div>

          <!-- Rango de profundidad: casilla vacía = sin límite por ese lado -->
          <div class="campo">
            <div class="rango">
              <div>
                <label for="profDesde">Desde [m]</label>
                <input type="number" id="profDesde" min="0" step="1" inputmode="decimal" placeholder="superficie">
              </div>
              <div>
                <label for="profHasta">Hasta [m]</label>
                <input type="number" id="profHasta" min="0" step="1" inputmode="decimal" placeholder="fondo">
              </div>
            </div>
          </div>
          <div class="campo">
            <button type="button" id="btnTodo">Toda la columna</button>
          </div>

          <div id="resumen"></div>
          <div id="mensaje"></div>

          <p class="nota">
            Líneas grises: densidad σ<sub>t</sub> [kg/m³] (densidad a presión de superficie menos 1000; fórmula UNESCO EOS-80).
            Temperatura in situ, datos sin promediar.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== AJUSTES (puedes cambiarlos) ======
    const CAMPANA_ID = "1_septiembre_2023";
    const RAIZ = "../";                              // esta página está en campanas/, los datos en la raíz
    const ARCHIVO_INDICE = RAIZ + "datos/indice.json";
    const PASO_ISOPICNAS = 1;                        // separación entre líneas de densidad [kg/m³]

    // Paleta "deep" de cmocean (aproximada): claro = superficie, oscuro = fondo
    const PALETA_DEEP = [
      [0.0, "#fdfecc"], [0.2, "#9ad7a7"], [0.4, "#4fa9a6"],
      [0.6, "#3c75a1"], [0.8, "#3f4785"], [1.0, "#281a2c"]
    ];
    const TAMANO_PUNTO = 6;            // diámetro de los puntos [px]
    const BORDE_PUNTO = { color: "#000000", width: 0.6 };   // borde negro: se ven hasta los puntos más claros

    // ====== DENSIDAD σt (UNESCO EOS-80, presión 0) ======
    // S: salinidad práctica [PSU], T: temperatura [°C]. Devuelve densidad - 1000 [kg/m³].
    function sigmaT(S, T) {
      const rhoAguaPura = 999.842594 + 6.793952e-2 * T - 9.095290e-3 * T ** 2
        + 1.001685e-4 * T ** 3 - 1.120083e-6 * T ** 4 + 6.536332e-9 * T ** 5;
      const A = 0.824493 - 4.0899e-3 * T + 7.6438e-5 * T ** 2 - 8.2467e-7 * T ** 3 + 5.3875e-9 * T ** 4;
      const B = -5.72466e-3 + 1.0227e-4 * T - 1.6546e-6 * T ** 2;
      const C = 4.8314e-4;
      return rhoAguaPura + A * S + B * S ** 1.5 + C * S ** 2 - 1000;
    }

    // Salinidad que da una densidad σ a temperatura T (σt crece con S: búsqueda por bisección)
    function salinidadParaSigma(sigma, T) {
      let bajo = 0, alto = 42;
      for (let k = 0; k < 40; k++) {
        const medio = (bajo + alto) / 2;
        if (sigmaT(medio, T) < sigma) bajo = medio; else alto = medio;
      }
      return (bajo + alto) / 2;
    }

    // ====== LECTURA DEL EXCEL ======
    // Primera hoja → columnas numéricas (la 2ª "Temperature" pasa a "Temperature (2)")
    function tablaDesdeExcel(buffer) {
      const libro = XLSX.read(buffer, { type: "array" });
      const hoja = libro.Sheets[libro.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true });
      const vistos = {};
      const nombres = filas[0].map(c => {
        const n = String(c === undefined || c === null ? "" : c).trim();
        vistos[n] = (vistos[n] || 0) + 1;
        return vistos[n] === 1 ? n : `${n} (${vistos[n]})`;
      });
      const columnas = {};
      nombres.forEach((n, i) => {
        columnas[n] = filas.slice(1).map(fila => {
          const v = fila[i];
          return typeof v === "number" && isFinite(v) ? v : null;
        });
      });
      return columnas;
    }

    // Todos los puntos de la campaña (un arreglo por variable)
    const puntos = { S: [], T: [], prof: [], est: [], sig: [] };

    // ====== RANGO DE PROFUNDIDAD ======
    function leerRango() {
      const leer = id => {
        const texto = document.getElementById(id).value.trim();
        const numero = parseFloat(texto.replace(",", "."));
        return texto === "" || !isFinite(numero) ? null : numero;
      };
      let desde = leer("profDesde"), hasta = leer("profHasta");
      if (desde !== null && hasta !== null && desde > hasta) [desde, hasta] = [hasta, desde];
      return { desde, hasta };
    }

    // ====== ISOPICNAS (calculadas una vez, para el rango de los datos) ======
    let isopicnas = { trazas: [], etiquetas: [] };
    let limitesEjes = null;

    // Mínimo y máximo sin "Math.min(...arreglo)", que falla en algunos navegadores con muchos datos
    const minimo = arr => arr.reduce((a, b) => (b < a ? b : a), Infinity);
    const maximo = arr => arr.reduce((a, b) => (b > a ? b : a), -Infinity);

    function calcularIsopicnas() {
      const minS = minimo(puntos.S), maxS = maximo(puntos.S);
      const minT = minimo(puntos.T), maxT = maximo(puntos.T);
      const margenS = (maxS - minS) * 0.04, margenT = (maxT - minT) * 0.06;
      limitesEjes = {
        S: [minS - margenS, maxS + margenS],
        T: [minT - margenT, maxT + margenT]
      };

      // Densidades en las esquinas del gráfico → qué líneas cruzan el área
      const esquinas = [];
      limitesEjes.S.forEach(s => limitesEjes.T.forEach(t => esquinas.push(sigmaT(s, t))));
      const sigMin = Math.ceil(Math.min(...esquinas) / PASO_ISOPICNAS) * PASO_ISOPICNAS;
      const sigMax = Math.floor(Math.max(...esquinas) / PASO_ISOPICNAS) * PASO_ISOPICNAS;

      const nT = 60;
      for (let sig = sigMin; sig <= sigMax + 1e-9; sig += PASO_ISOPICNAS) {
        const xs = [], ys = [];
        for (let k = 0; k <= nT; k++) {
          const t = limitesEjes.T[0] + (limitesEjes.T[1] - limitesEjes.T[0]) * k / nT;
          xs.push(salinidadParaSigma(sig, t));
          ys.push(t);
        }
        isopicnas.trazas.push({
          x: xs, y: ys,
          type: "scattergl", mode: "lines",
          line: { color: "#9aa0a6", width: 1, dash: "dot" },
          hoverinfo: "skip", showlegend: false
        });
        // Etiqueta en el extremo superior de la línea, si cae dentro del eje de salinidad
        const sArriba = xs[xs.length - 1];
        if (sArriba > limitesEjes.S[0] && sArriba < limitesEjes.S[1]) {
          isopicnas.etiquetas.push({
            x: sArriba, y: limitesEjes.T[1], text: String(sig),
            showarrow: false, yanchor: "bottom", font: { size: 11, color: "#6b7178" }
          });
        }
      }
    }

    // ====== DIBUJO ======
    function dibujar() {
      const { desde, hasta } = leerRango();
      const estacion = document.getElementById("selEstacion").value;
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      // Índices de los puntos de la estación elegida dentro del rango de profundidad
      const dentro = [];
      for (let i = 0; i < puntos.S.length; i++) {
        if (puntos.est[i] !== estacion) continue;
        const p = puntos.prof[i];
        if (desde !== null && p < desde) continue;
        if (hasta !== null && p > hasta) continue;
        dentro.push(i);
      }
      const tomar = (idx, campo) => idx.map(i => puntos[campo][i]);
      const datosHover = idx => idx.map(i => [puntos.est[i], puntos.prof[i], puntos.sig[i]]);
      const plantillaHover =
        "%{customdata[0]} · %{customdata[1]:.1f} m<br>S: %{x:.3f} PSU<br>T: %{y:.3f} °C<br>σt: %{customdata[2]:.2f} kg/m³<extra></extra>";

      // Escala de color fija para toda la campaña: el mismo color = la misma profundidad en todas las estaciones
      const profMaxTotal = maximo(puntos.prof);
      const pasoTicks = profMaxTotal > 200 ? 50 : 25;
      const ticks = [];
      for (let v = 0; v <= profMaxTotal; v += pasoTicks) ticks.push(v);

      // Color = profundidad. Se usa -profundidad para que la barra de color tenga la superficie arriba.
      const trazasDatos = [{
        x: tomar(dentro, "S"), y: tomar(dentro, "T"),
        customdata: datosHover(dentro),
        type: "scattergl", mode: "markers",
        marker: {
          size: TAMANO_PUNTO,
          line: BORDE_PUNTO,
          color: dentro.map(i => -puntos.prof[i]),
          cmin: -profMaxTotal, cmax: 0,
          colorscale: PALETA_DEEP.map(([v, c]) => [1 - v, c]).reverse(),   // 0 m claro, fondo oscuro
          colorbar: {
            title: { text: "Profundidad [m]", side: "right" },
            tickvals: ticks.map(v => -v), ticktext: ticks.map(String),
            thickness: 14, len: 0.9
          }
        },
        hovertemplate: plantillaHover, showlegend: false
      }];
      if (dentro.length === 0) mensaje.textContent = `${estacion} no tiene datos en ese rango de profundidad.`;

      const sufijo = (desde !== null || hasta !== null)
        ? `_${desde !== null ? desde : 0}-${hasta !== null ? hasta : "fondo"}m` : "";

      Plotly.react("grafico", [...isopicnas.trazas, ...trazasDatos], {
        title: { text: `Diagrama T-S · Estación ${estacion} · Septiembre 2023`, font: { family: "Georgia, serif", size: 16 } },
        margin: { l: 70, r: 20, t: 60, b: 60 },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        xaxis: { title: { text: "Salinidad [PSU]" }, range: limitesEjes.S, gridcolor: "#eeebe4", zeroline: false },
        yaxis: { title: { text: "Temperatura [°C]" }, range: limitesEjes.T, gridcolor: "#eeebe4", zeroline: false },
        annotations: isopicnas.etiquetas,
        legend: { x: 0.01, y: 0.99, bgcolor: "rgba(255,255,255,0.8)" },
        font: { family: "Arial, Helvetica, sans-serif", color: "#22262b" }
      }, {
        responsive: true,
        displaylogo: false,
        toImageButtonOptions: {
          format: "png", scale: 3,
          filename: `diagrama_TS_${CAMPANA_ID}_${estacion}` + sufijo
        }
      });

      const textoRango = (desde !== null || hasta !== null)
        ? ` entre ${desde !== null ? desde : "superficie"} y ${hasta !== null ? hasta + " m" : "fondo"}` : "";
      document.getElementById("resumen").textContent =
        `${estacion}: ${dentro.length.toLocaleString("es-CL")} mediciones${textoRango}`;
    }

    // ====== CARGA DE LAS 17 ESTACIONES ======
    async function iniciar() {
      const cargando = document.getElementById("cargando");
      const indice = await (await fetch(ARCHIVO_INDICE)).json();
      const campana = indice.campanas.find(c => c.id === CAMPANA_ID);
      const estaciones = Object.keys(campana.archivos).sort();

      let listas = 0;
      const tablas = await Promise.all(estaciones.map(async id => {
        const respuesta = await fetch(encodeURI(RAIZ + campana.archivos[id].ruta));
        if (!respuesta.ok) throw new Error("No se encontró el archivo de " + id);
        const columnas = tablaDesdeExcel(await respuesta.arrayBuffer());
        listas++;
        cargando.textContent = `Cargando datos… ${listas} de ${estaciones.length} estaciones`;
        return { id, columnas };
      }));

      // Junta todas las estaciones; solo filas con S, T y profundidad
      tablas.forEach(({ id, columnas }) => {
        const S = columnas["Salinity"], T = columnas["Temperature"], P = columnas["Depth"];
        for (let i = 0; i < S.length; i++) {
          if (S[i] === null || T[i] === null || P[i] === null) continue;
          puntos.S.push(S[i]); puntos.T.push(T[i]); puntos.prof.push(P[i]);
          puntos.est.push(id); puntos.sig.push(sigmaT(S[i], T[i]));
        }
      });

      const selEstacion = document.getElementById("selEstacion");
      estaciones.forEach(id => selEstacion.add(new Option(id, id)));

      document.getElementById("grafico").innerHTML = "";
      calcularIsopicnas();
      dibujar();
    }

    document.getElementById("selEstacion").addEventListener("change", dibujar);
    document.getElementById("profDesde").addEventListener("input", dibujar);
    document.getElementById("profHasta").addEventListener("input", dibujar);
    document.getElementById("btnTodo").addEventListener("click", () => {
      document.getElementById("profDesde").value = "";
      document.getElementById("profHasta").value = "";
      dibujar();
    });

    if (typeof XLSX === "undefined" || typeof Plotly === "undefined") {
      document.getElementById("cargando").textContent = "No se pudieron cargar las librerías. Revisa tu conexión a internet.";
    } else {
      iniciar().catch(e => {
        document.getElementById("cargando").textContent =
          e.message + ". Esta página debe abrirse desde GitHub Pages, no con doble clic.";
      });
    }
  </script>
</body>
</html>
