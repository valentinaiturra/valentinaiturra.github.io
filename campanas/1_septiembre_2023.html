<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaña Septiembre 2023</title>
  <meta name="description" content="Perfiles CTD de la campaña Septiembre 2023 en el fiordo Puyuhuapi, proyecto Fondecyt 1262020">

  <!-- Tipografía Fraunces (la misma de la línea de tiempo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
  <!-- Leaflet: mapa interactivo -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- SheetJS: lee los Excel directamente en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Plotly (versión "basic", solo líneas y puntos): gráfico del perfil -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly-basic.min.js"></script>
  <!-- Estilo compartido por todas las páginas de campaña -->
  <link rel="stylesheet" href="visor_campana.css">
</head>

<body>
  <div class="contenedor">
    <a class="volver" href="../linea_tiempo.html">&larr; Línea de tiempo</a>
    <h1>Septiembre 2023</h1>
    <p class="subtitulo">Campaña 1 · <span id="nEstaciones">17 estaciones</span> · Proyecto Fondecyt 1262020</p>

    <div class="principal">
      <!-- ====== MAPA ====== -->
      <div class="caja">
        <div id="mapa" role="region" aria-label="Mapa de estaciones"></div>
      </div>

      <!-- ====== PERFIL ====== -->
      <div class="caja panel">
        <div id="sinEstacion" class="vacio">Haz clic en una estación del mapa para ver su perfil.</div>

        <div id="conEstacion" class="zona-perfil" hidden>
          <!-- Gráfico (izquierda) -->
          <div id="grafico"></div>

          <!-- Columna de controles (derecha) -->
          <div class="lateral">
            <h2 id="tituloEstacion"></h2>
            <p class="info" id="infoEstacion"></p>

            <div class="campo">
              <label for="selVariable">Variable</label>
              <select id="selVariable"></select>
            </div>

            <!-- Rango de profundidad: casilla vacía = sin límite por ese lado -->
            <div class="campo">
              <div class="rango">
                <div>
                  <label for="profDesde">Desde [m]</label>
                  <input type="number" id="profDesde" min="0" step="1" inputmode="decimal" placeholder="superficie">
                </div>
                <div>
                  <label for="profHasta">Hasta [m]</label>
                  <input type="number" id="profHasta" min="0" step="1" inputmode="decimal" placeholder="fondo">
                </div>
              </div>
            </div>
            <div class="campo">
              <button type="button" id="btnTodo">Todo el perfil</button>
            </div>

            <div id="resumen"></div>
            <div id="mensaje"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Datos sin promediar, tal como salen de los archivos CTD (bajada). Usa el ícono de cámara del gráfico para descargarlo en PNG.
    </footer>
  </div>

  <!-- La única línea que cambia entre páginas de campaña: qué campaña mostrar (id de datos/indice.json) -->
  <script>const CAMPANA_ID = "1_septiembre_2023";</script>
  <script src="visor_campana.js"></script>
</body>
</html>
