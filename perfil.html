<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil vertical CTD | Puyuhuapi E02</title>

  <!-- Chart.js: dibuja la gráfica -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- SheetJS: lee archivos Excel (.xlsx) directamente en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.6;
      color: #22262b;
      background: #f6f4ef;
    }
    .contenedor {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    h1 { margin: 12px 0 8px; line-height: 1.2; }
    p  { color: #5c636b; margin: 0 0 20px; }
    a  { color: #1f5f5b; }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
    }
    .controles label { display: block; margin-bottom: 4px; color: #5c636b; }
    select {
      font-size: 1rem;
      padding: 8px 10px;
      border: 1px solid #dcd8cd;
      border-radius: 6px;
      background: #ffffff;
      color: #22262b;
      min-width: 260px;
      max-width: 100%;
    }
    select:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #e0a526;
      outline-offset: 2px;
    }

    .caja-grafica {
      background: #ffffff;
      border: 1px solid #dcd8cd;
      border-radius: 8px;
      padding: 16px;
      height: 600px;
    }
    #resumen {
      margin-top: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      color: #5c636b;
    }
    #mensaje {
      color: #b3261e;
      margin-top: 12px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .extra {
      margin-top: 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
    }
    button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      background: #1f5f5b;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      cursor: pointer;
    }
    button:hover { background: #174744; }

    @media (max-width: 520px) {
      .caja-grafica { height: 480px; }
      select { min-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <a href="index.html">← Volver al inicio</a>
    <h1>Perfil vertical CTD: Puyuhuapi, estación E02</h1>
    <p>09-11-2025. Elige una variable y la gráfica se actualiza sola.</p>

    <div class="controles">
      <div>
        <label for="selX">Variable (eje horizontal superior)</label>
        <select id="selX"></select>
      </div>
      <div>
        <label for="selX2">Comparar con otra variable (opcional)</label>
        <select id="selX2"></select>
      </div>
      <div>
        <label for="selY">Eje vertical</label>
        <select id="selY"></select>
      </div>
    </div>

    <div class="caja-grafica">
      <canvas id="grafico"></canvas>
    </div>
    <div id="resumen"></div>
    <div id="mensaje"></div>

    <div class="extra">
      <button id="botonPNG" type="button">Descargar gráfica (PNG)</button>
      <br><br>
      <label for="archivo">Probar con otro archivo Excel (solo lo verás tú, no se sube a ningún lado):</label><br>
      <input type="file" id="archivo" accept=".xlsx,.xls,.csv">
    </div>
  </div>

  <script>
    // ====== AJUSTES (puedes cambiarlos) ======
    const ARCHIVO_DATOS = "CTD_PUYUHUAPI_E02_09_11_2025_09_53.xlsx"; // nombre exacto del Excel en tu repositorio
    const COLOR_1 = "#2a7f9e";   // línea de la variable principal
    const COLOR_2 = "#d9822b";   // línea de la variable de comparación

    // Nombres en español con unidades. Las unidades son las habituales para cada variable;
    // si alguna no coincide con tu instrumento, corrígela aquí.
    // Las columnas que no estén en esta lista se muestran con su nombre original.
    const NOMBRES = {
      "Conductivity": "Conductividad (mS/cm)",
      "Temperature": "Temperatura 1 (°C)",
      "Temperature (2)": "Temperatura 2 (°C)",
      "Pressure": "Presión (dbar)",
      "Chlorophyll a": "Clorofila a (µg/L)",
      "Dissolved O₂ concentration": "Oxígeno disuelto, concentración (µmol/L)",
      "Sea pressure": "Presión del mar (dbar)",
      "Depth": "Profundidad (m)",
      "Salinity": "Salinidad (PSU)",
      "Speed of sound": "Velocidad del sonido (m/s)",
      "Specific conductivity": "Conductividad específica (µS/cm)",
      "Dissolved O₂ saturation": "Oxígeno disuelto, saturación (%)",
      "Density anomaly": "Anomalía de densidad (kg/m³)"
    };

    let tabla = null;      // { nombres: [...], columnas: { nombre: [valores] } }
    let grafico = null;

    const etiqueta = n => NOMBRES[n] || n;

    // Convierte las filas del Excel en columnas numéricas.
    // - Si hay nombres repetidos (dos "Temperature"), agrega (2), (3)...
    // - Ignora columnas sin datos y las que no son números (como la hora).
    function tablaDesdeFilas(filas) {
      const cabecera = filas[0].map(c => String(c === undefined || c === null ? "" : c).trim());
      const vistos = {};
      const nombres = cabecera.map(n => {
        vistos[n] = (vistos[n] || 0) + 1;
        return vistos[n] === 1 ? n : n + " (" + vistos[n] + ")";
      });

      const columnas = {};
      nombres.forEach(n => columnas[n] = []);

      for (let r = 1; r < filas.length; r++) {
        const fila = filas[r] || [];
        nombres.forEach((n, i) => {
          const v = fila[i];
          columnas[n].push(typeof v === "number" && isFinite(v) ? v : null);
        });
      }

      const utiles = nombres.filter((n, i) =>
        cabecera[i] !== "" && columnas[n].some(v => v !== null)
      );
      return { nombres: utiles, columnas };
    }

    // Lee un Excel (en formato de bytes) y devuelve la tabla de la primera hoja
    function leerExcel(buffer) {
      const libro = XLSX.read(buffer, { type: "array", cellDates: true });
      const hoja = libro.Sheets[libro.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true });
      return tablaDesdeFilas(filas);
    }

    function buscarProfundidad(nombres) {
      return nombres.find(n => /depth|profund/i.test(n)) || nombres[0];
    }

    function llenarSelectores() {
      const selX = document.getElementById("selX");
      const selX2 = document.getElementById("selX2");
      const selY = document.getElementById("selY");
      selX.innerHTML = "";
      selX2.innerHTML = "";
      selY.innerHTML = "";

      selX2.add(new Option("Ninguna", ""));
      tabla.nombres.forEach(n => {
        selX.add(new Option(etiqueta(n), n));
        selX2.add(new Option(etiqueta(n), n));
        selY.add(new Option(etiqueta(n), n));
      });

      const y = buscarProfundidad(tabla.nombres);
      selY.value = y;
      selX.value = tabla.nombres.find(n => n !== y) || y;   // primera variable que no sea la profundidad
      selX2.value = "";
    }

    // Fondo blanco para que el PNG descargado no quede transparente
    const fondoBlanco = {
      id: "fondoBlanco",
      beforeDraw(c) {
        const ctx = c.canvas.getContext("2d");
        ctx.save();
        ctx.globalCompositeOperation = "destination-over";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.restore();
      }
    };

    function dibujar() {
      const nx = document.getElementById("selX").value;
      const nx2 = document.getElementById("selX2").value;
      const ny = document.getElementById("selY").value;
      const ys = tabla.columnas[ny];

      function puntosDe(nombre) {
        const xs = tabla.columnas[nombre];
        const p = [];
        for (let i = 0; i < xs.length; i++) {
          if (xs[i] !== null && ys[i] !== null) p.push({ x: xs[i], y: ys[i] });
        }
        return p;
      }

      const series = [{ nombre: nx, color: COLOR_1, eje: "x", puntos: puntosDe(nx) }];
      if (nx2 !== "") series.push({ nombre: nx2, color: COLOR_2, eje: "x2", puntos: puntosDe(nx2) });

      const escalas = {
        x: {
          position: "top",   // la variable arriba, como en los perfiles oceanográficos
          title: { display: true, text: etiqueta(nx), color: COLOR_1 },
          ticks: { color: COLOR_1 }
        },
        y: {
          reverse: true,     // la profundidad aumenta hacia abajo
          title: { display: true, text: etiqueta(ny) }
        }
      };
      if (nx2 !== "") {
        escalas.x2 = {
          position: "bottom",
          title: { display: true, text: etiqueta(nx2), color: COLOR_2 },
          ticks: { color: COLOR_2 },
          grid: { drawOnChartArea: false }
        };
      }
      if (/depth|profund|pressure|presi/i.test(ny)) escalas.y.min = 0;

      if (grafico) grafico.destroy();

      grafico = new Chart(document.getElementById("grafico"), {
        type: "scatter",
        plugins: [fondoBlanco],
        data: {
          datasets: series.map(s => ({
            label: etiqueta(s.nombre),
            data: s.puntos,
            xAxisID: s.eje,
            showLine: true,
            borderColor: s.color,
            backgroundColor: s.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 4
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "y", intersect: false },
          plugins: {
            legend: { display: series.length > 1 },
            tooltip: {
              callbacks: {
                title: items => etiqueta(ny) + ": " + items[0].parsed.y.toFixed(2),
                label: c => c.dataset.label + ": " + c.parsed.x.toFixed(3)
              }
            }
          },
          scales: escalas
        }
      });

      // Resumen con mínimo y máximo de cada variable
      const partes = series.map(s => {
        if (s.puntos.length === 0) return etiqueta(s.nombre) + ": sin datos";
        const vals = s.puntos.map(p => p.x);
        return etiqueta(s.nombre) + ": mínimo " + Math.min(...vals).toFixed(3) +
               ", máximo " + Math.max(...vals).toFixed(3);
      });
      document.getElementById("resumen").textContent =
        partes.join("  |  ") + "  (" + series[0].puntos.length + " mediciones)";
    }

    function mostrarError(texto) {
      document.getElementById("mensaje").textContent = texto;
    }

    function cargarTabla(nuevaTabla) {
      mostrarError("");
      if (nuevaTabla.nombres.length < 2) {
        mostrarError("El archivo necesita al menos dos columnas con números.");
        return;
      }
      tabla = nuevaTabla;
      llenarSelectores();
      dibujar();
    }

    // ====== Carga automática del Excel del repositorio ======
    if (typeof XLSX === "undefined" || typeof Chart === "undefined") {
      mostrarError("No se pudieron cargar las librerías. Revisa tu conexión a internet.");
    } else {
      fetch(ARCHIVO_DATOS)
        .then(r => {
          if (!r.ok) throw new Error("No se encontró " + ARCHIVO_DATOS);
          return r.arrayBuffer();
        })
        .then(buffer => cargarTabla(leerExcel(buffer)))
        .catch(e => mostrarError(
          e.message + ". Revisa que el archivo esté subido junto a esta página, con el mismo nombre. " +
          "Esta página debe abrirse desde GitHub Pages, no con doble clic."
        ));
    }

    // ====== Controles ======
    document.getElementById("selX").addEventListener("change", dibujar);
    document.getElementById("selX2").addEventListener("change", dibujar);
    document.getElementById("selY").addEventListener("change", dibujar);

    document.getElementById("botonPNG").addEventListener("click", () => {
      if (!grafico) return;
      const enlace = document.createElement("a");
      enlace.href = grafico.toBase64Image();
      enlace.download = "perfil_CTD.png";
      enlace.click();
    });

    // Probar con otro archivo local
    document.getElementById("archivo").addEventListener("change", evento => {
      const archivo = evento.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = () => {
        try {
          cargarTabla(leerExcel(lector.result));
        } catch (e) {
          mostrarError("No se pudo leer ese archivo.");
        }
      };
      lector.readAsArrayBuffer(archivo);
    });
  </script>
</body>
</html>
